<text x="175" y="604" font-size="12.5" text-anchor="middle" fill="#222">Trình duyệt mở http://&lt;IP của Pi&gt;:5000</text>
<text x="175" y="622" font-size="12" text-anchor="middle" fill="#222">(cùng mạng WiFi với Pi)</text>
<text x="335" y="440" font-size="13" text-anchor="middle" fill="#0b8a63" font-weight="700">WiFi</text>
<rect x="40" y="700" width="1240" height="130" rx="10" fill="#f7f8fa" stroke="#c9ced6"/>
<text x="58" y="726" font-size="14" text-anchor="start" fill="#222" font-weight="700">Ghi chú</text>
<text x="58" y="752" font-size="12.5" text-anchor="start" fill="#222">• Bluetooth dùng chip có sẵn trên Pi 3B+, không cần nối dây: ghép đôi một lần với HC-05 (PIN mặc định 1234 hoặc 0000).</text>
<text x="58" y="778" font-size="12.5" text-anchor="start" fill="#222">• Serial dự phòng dùng cáp USB nên không cần mạch hạ áp. Nếu thầy cô yêu cầu UART qua GPIO14/15 thì phải thêm cầu chia áp 1kΩ + 2kΩ ở đường TX Arduino → RX Pi.</text>
<text x="58" y="804" font-size="12.5" text-anchor="start" fill="#222">• Tinkercad không có Raspberry Pi và LED 4 số, nên phần này chỉ lắp trên mạch thật.</text>
